AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage environment

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        Stage: !Ref Stage
        USER_MEMORY_TABLE: !Ref UserMemoryTable

Resources:
  MonitusHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Content-Type"
        AllowMethods:
          - "GET"
          - "POST"
          - "OPTIONS"

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.chat.handler
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref MonitusSessionsTable
      Policies:
        - AmazonBedrockFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref MonitusSessionsTable
      Events:
        ChatApiEvent:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref MonitusHttpApi
        GetHistoryEvent:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: GET
            ApiId: !Ref MonitusHttpApi

  MonitusSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  UserMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: memory_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: memory_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  MemoryExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.extractor.handler
      Runtime: python3.12
      Timeout: 30
      Policies:
        - AmazonBedrockFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref UserMemoryTable
      Events:
        SessionStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt MonitusSessionsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1

Outputs:
  ChatApiEndpoint:
    Description: "HTTP API Gateway endpoint URL"
    Value: !Sub "https://${MonitusHttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat"