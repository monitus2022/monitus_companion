AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Monitus Companion - Stage 2 Multi-Environment SAM Stack with Persistent Memory Engine

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment stage

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        CHAT_TABLE: !Ref ChatTable
        USER_MEMORY_TABLE: !Ref UserMemoryTable
        BEDROCK_MODEL_ID: "us.amazon.nova-2-lite-v1:0"

Resources:
  # -------------------------------------------------------------------
  # 1. API Gateway (HTTP API)
  # -------------------------------------------------------------------
  MonitusHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
        AllowMethods:
          - "GET"
          - "POST"
          - "OPTIONS"

  # -------------------------------------------------------------------
  # 2. DynamoDB Tables
  # -------------------------------------------------------------------
  # Short-Term Session Store (48-hr TTL + DynamoDB Stream Enabled)
  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "monitus-chat-sessions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # Long-Term Semantic Memory Store
  UserMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "monitus-user-memory-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: fact_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: fact_id
          KeyType: RANGE

  # -------------------------------------------------------------------
  # 3. Lambda Functions
  # -------------------------------------------------------------------
  # Core Chat Handler (Synchronous API Gateway Integration)
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/chat.handler
      Events:
        GetHistory:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: GET
            ApiId: !Ref MonitusHttpApi
        SendMessage:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref MonitusHttpApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserMemoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

  # Async Fact Extractor Handler (DynamoDB Stream Integration)
  ExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/extractor.handler
      Events:
        StreamEvent:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ChatTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 1
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT", "MODIFY"]}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserMemoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

Outputs:
  ApiEndpoint:
    Description: "HTTP API Gateway endpoint URL"
    Value: !Sub "https://${MonitusHttpApi}.execute-api.${AWS::Region}.amazonaws.com"